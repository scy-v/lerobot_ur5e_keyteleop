record:
  repo_id: &repo_id "scylearning/insert_small_reagent_bottle_into_rack"
  # repo_id: &repo_id "scylearning/pick_greencube_into_trashbin" 
  # Suggested format: <hf_username>/<description>, description = task.description -> Verb_SourceObject_prep_TargetObject
  # e.g. Pick up the green cube and put it into the trash bin -> pick_greencube_into_trashbin
  user_notes:  # any additional notes about the dataset
  fps: 15 # dataset and camera frame rate

  robot:
    ip: &ip "192.168.201.11" # robot_ip
    use_gripper: &use_gripper True
    init_gripper: &init_gripper True # If False, skip DH gripper init_state/init_feedback
    close_threshold: 0.7 # threshold to determine gripper open/close
    gripper_bin_threshold: 0.98 # threshold to determine gripper is closed
    gripper_port: &gripper_port "/dev/ur5e_left_gripper" # gripper_port
    gripper_reverse: &gripper_reverse False # If gripper moves opposite, flip this value
    gripper_force: &gripper_force 70 # gripper force command
    gripper_speed: &gripper_speed 60 # gripper speed command
    debug: False # if True, robot will not execute arm actions, but gripper can still be controlled
    control_space: "force" # "position" or "force"
    reference_frame: "tcp" # "base" or "tcp"; tcp_pose fields store EE/flange pose after removing UR TCP offset
    init_pose: [0.621186, -0.070673, 0.292553, 2.126131, -2.270473, -0.030898] # robot reset TCP pose [x, y, z, rx, ry, rz]
    init_pos_range: [0.02, 0.02, 0.02] # max random range for reset TCP position [x, y, z]
    force_mode:
      kp: 1200
      kd: 600
      kp_rot: 2000
      kd_rot: 400
      rtde_freq: 100
      select_vector: [1, 1, 1, 0, 0, 0]
      force_limit: [2, 2, 2, 2, 2, 2]
      pos_delta: 0.02
      vel_delta: 4.0                                                                                                                                                                                                                                                                                                                                                                                    
      gain_scale: 1.5
    position_mode:
      speed: 0.2 # not used in servoL, only used in reset
      acceleration: 0.2 # not used in servoL, only used in reset
      servo_time: 0.1
      lookahead_time: 0.1
      gain: 300
    payload:
      mass: 1.601
      cog: [0.011, -0.002, 0.052]

  teleop:
    position_step_size: 0.006 # keyboard xyz target delta for position control
    force_step_size: 0.048 # keyboard xyz target delta for force control
    position_rot_step_size: 0.02 # keyboard euler angle target delta for position control [rx, ry, rz]
    force_rot_step_size: 0.05 # keyboard euler angle target delta for force control [rx, ry, rz]

  task:
    description: "Insert the small reagent bottle into the rack" # task description
    num_episodes: 150 # number of episodes to record
    display: True # Whether to display the data during recording
    resume: False
    resume_dataset: scylearning/insert_small_reagent_bottle_into_rack_20260516_v01 # dataset to resume from if resume is True

  time:
    episode_time_sec: 600 # max time per episode in seconds
    reset_time_sec: 600 # max time to reset between episodes in seconds
    save_meta_period: 1 # Save metadata after every N episodes

  cameras:
    wrist_cam_serial: "944622073455" # wrist camera serial number
    exterior_cam_serial: "213522072373" # exterior camera serial number
    width: 640 # 640 424
    height: 480 # 360 240

  storage:
    push_to_hub: False # whether to push the dataset to your huggingface repo after recording

replay:
  repo_id: *repo_id
  episode_idx: 0 # episode index to replay
  robot:
    ip: *ip
    gripper_port: *gripper_port
    use_gripper: *use_gripper
    init_gripper: *init_gripper
    gripper_reverse: *gripper_reverse
    gripper_force: *gripper_force
    gripper_speed: *gripper_speed

visualize:
  dataset_name: scylearning/insert_reagent_bottle_into_rack_20260516_v01
  episode_index: 149 # episode index to visualize
  default_obs_group: "tcp_pose" # default observation group shown in the data window
  data_window: True # open a local browser window for per-frame action and selected observation data
  print_to_terminal: False # also print per-frame data to terminal

check_dataset:
  dataset_name: scylearning/test_20260516_v01

prune_episodes:
  old_dataset_name: scylearning/test_20260516_v01
  new_dataset_name: scylearning/test_20260516_v01_pruned
